[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hive"
version = "2.5.0"
description = "Shared memory for all AI coding agents (Obsidian vault + graphify code graphs)"
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
authors = [
    { name = "4LPH7" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/4LPH7/Hive_Mind"
Issues = "https://github.com/4LPH7/Hive_Mind/issues"

[project.scripts]
hive = "hive:main"

[tool.setuptools]
py-modules = ["hive", "ace", "curate", "ledger", "lint", "llm", "miner", "skill"]
